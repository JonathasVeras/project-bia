name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: List build artifacts (Linux)
        if: always() && matrix.platform == 'ubuntu-22.04'
        run: |
          echo "=== Checking artifacts ==="
          find src-tauri/target -name "*.deb" -o -name "*.AppImage" 2>/dev/null || echo "No artifacts found"

      - name: List build artifacts (Windows)
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Checking artifacts ==="
          Get-ChildItem -Path src-tauri/target -Recurse -Include *.exe,*.msi -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "BIA v__VERSION__"
          releaseBody: "Veja os assets para baixar e instalar esta versão."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }}
